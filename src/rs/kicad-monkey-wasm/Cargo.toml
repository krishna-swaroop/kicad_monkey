[package]
name = "kicad-monkey-wasm"
description = "Browser WASM adapters for KiCad Monkey byte operations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[features]
default = ["sexpr", "footprint", "symbol", "board", "materialization", "materialize"]
sexpr = []
footprint = []
symbol = []
board = []
materialization = ["dep:kicad-monkey-materialization-pack"]
materialize = ["materialization"]

[dependencies]
kicad-monkey-contracts = { path = "../kicad-monkey-contracts" }
kicad-monkey-core = { path = "../kicad-monkey-core", default-features = false }
kicad-monkey-materialization-pack = { path = "../kicad-monkey-materialization-pack", optional = true }
serde.workspace = true
serde_json.workspace = true
wasm-bindgen.workspace = true

[dev-dependencies]
wasm-bindgen-test.workspace = true
